name: MERCO Envato Catalog Sync

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Synchroniser le catalogue MERCO
        env:
          SYNC_URL: ${{ secrets.MERCO_SYNC_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --max-time 300 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SYNC_URL"
